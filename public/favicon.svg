  <g id="glyph" fill="none" stroke="#fff7ed" stroke-width="12">
    <path d="M16 40h40M36 40v52" stroke-linecap="butt"/>
    <path d="M101.6 50.4A22 22 0 1 0 108 66H88" stroke-linejoin="miter"/>
  </g>
</svg>
