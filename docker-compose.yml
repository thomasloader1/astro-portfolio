services:
  astro-portfolio-dev:
    container_name: astro
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./scripts:/app/scripts
    environment:
      - NODE_ENV=development
      - PROJECT_DOMAIN=astro.dev.local
    ports:
      # Host 4322 so it can run alongside a local `astro dev` on 4321
      - "4322:4321"
